services:
  license-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ${BOOKS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://books:${POSTGRES_PASSWORD:?Generate .env with scripts/setup_server.py}@postgres:5432/books
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - license-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_DB: books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/setup_server.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  license-data:
  postgres-data:
