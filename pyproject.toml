[project]
name = "local-books-order"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=6,<7",
    "num2words>=0.5.14,<0.6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23",
    "keyring>=25,<26",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "langdetect>=1.0.9",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8,<10",
    "reportlab>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
