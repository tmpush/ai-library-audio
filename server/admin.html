<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Книжная мастерская — лицензии</title><style>
:root{color-scheme:light dark;font:14px 'Segoe UI',sans-serif;color:#243028;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #cdd5cc;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;background:#fff}h1{font-size:20px;font-weight:600;margin:0}main{padding:28px 32px;max-width:1400px;margin:auto}form{display:flex;align-items:end;gap:16px;flex-wrap:wrap}label{display:grid;gap:6px;font-size:12px}input,select,button,textarea{font:inherit;padding:9px 12px;border:1px solid #b9c5b9;border-radius:4px;background:#fff;color:#243028}button{cursor:pointer;min-height:38px}button:hover{border-color:#285d45}button:focus-visible,input:focus-visible{outline:2px solid #285d45;outline-offset:3px}.primary{background:#285d45;color:white}.muted{color:#59645d}section{margin:28px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #cdd5cc;vertical-align:top}th{color:#59645d;font-size:11px;letter-spacing:.05em;text-transform:uppercase}.table-wrap{overflow:auto}td button{padding:5px 8px;min-height:32px;margin:0 4px 4px 0;font-size:12px}#message{min-height:24px;color:#a32e27;margin:16px 0}#keys{width:100%;min-height:120px}#login{max-width:500px;margin:80px auto;display:grid;gap:20px}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}.activation{padding:12px 0;border-bottom:1px solid #cdd5cc;overflow-wrap:anywhere}small{font-size:12px}dialog{width:min(700px,90vw);border:1px solid #b9c5b9;background:#fff;color:#243028;padding:24px}dialog::backdrop{background:#0006}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{background:#191e1b;color:#edf1e8}header,input,select,button,textarea,dialog{background:#232b25;color:#edf1e8}th,.muted{color:#aebcaf}.primary{background:#a1d8ad;color:#17251a}}@media(max-width:650px){header,main{padding:16px}form{display:grid}}
</style></head><body><header><h1>Книжная мастерская / Лицензии</h1><button id="logout" hidden>Выйти</button></header><main>
<div id="message" role="status" aria-live="polite"></div>
<form id="login"><h2>Вход администратора</h2><label>Логин<input name="username" autocomplete="username" required value="admin"></label><label>Пароль<input name="password" autocomplete="current-password" type="password" required></label><button class="primary">Войти</button></form>
<div id="workspace" hidden><section><h2>Выпустить ключи</h2><form id="issue"><label>Тариф<select name="plan"><option value="month">Месяц · 30 дней</option><option value="year">Год · 365 дней</option></select></label><label>Устройств<input name="devices" type="number" min="1" max="100" value="2" required></label><label>Количество<input name="count" type="number" min="1" max="100" value="1" required></label><button class="primary">Создать ключи</button></form></section>
<section id="issued" hidden><h3>Сохраните новые ключи</h3><p class="muted">Полные ключи показываются только сейчас. На сервере сохраняются их хеши.</p><textarea id="keys" readonly aria-label="Созданные ключи"></textarea><button id="download-keys">Скачать новые ключи CSV</button></section>
<section><div class="actions"><h2>Подписки</h2><div><button id="refresh">Обновить</button> <button id="export">Экспорт списка CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Ключ</th><th>Тариф</th><th>Срок до</th><th>Устройства</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><details><summary>Журнал последних событий</summary><div id="audit"></div></details></section></div>
<dialog id="activations"><h2>Активированные устройства</h2><div id="devices"></div><form method="dialog"><button>Закрыть</button></form></dialog>
</main><script src="/admin.js" defer></script></body></html>
