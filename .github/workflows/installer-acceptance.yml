name: Windows installer acceptance
on:
  workflow_run:
    workflows: ['Native installers']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  install-uninstall:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: LocalBooksStudio-windows-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build/installer-artifact
      - name: Install, check engine and uninstall
        run: |
          $installer = (Get-ChildItem build/installer-artifact -Filter '*-setup.exe' -Recurse | Select-Object -First 1).FullName
          ./scripts/verify_windows_installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance
          path: artifacts/*check.json
          if-no-files-found: error
